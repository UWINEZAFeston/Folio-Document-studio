[theme]
base = "light"
primaryColor = "#C45134"
backgroundColor = "#F2F4EC"
secondaryBackgroundColor = "#E5ECE4"
textColor = "#1D3028"
linkColor = "#A6422C"
borderColor = "#C8D4C8"
font = "'DM Sans':https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
headingFont = "'Fraunces':https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
headingFontSizes = ["4rem", "3rem", "2rem", "1.5rem", "1.25rem", "1rem"]
headingFontWeights = [500, 500, 500, 500, 500, 500]
baseRadius = "6px"
buttonRadius = "4px"
showWidgetBorder = true